<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Zyvora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0e14;--surface:#13151f;--surface2:#1a1d2b;--border:#2a2d40;
  --accent:#6c63ff;--accent2:#00d4aa;--text:#e8eaf6;--text2:#9ca0b8;--text3:#5c6082;
  --danger:#ff6b6b;--success:#00d4aa;--radius:14px;--radius-sm:8px;
  --font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-wrap{width:100%;max-width:400px}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo-icon{width:52px;height:52px;background:var(--accent);border-radius:14px;display:inline-grid;place-items:center;font-size:1.5rem;margin-bottom:12px;box-shadow:0 8px 24px rgba(108,99,255,.4)}
.auth-logo-text{font-size:1.5rem;font-weight:700;color:var(--text);letter-spacing:-.02em}
.auth-logo-sub{font-size:.82rem;color:var(--text3);margin-top:4px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.auth-title{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.auth-sub{font-size:.82rem;color:var(--text3);margin-bottom:24px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-group label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.form-group input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.form-group input::placeholder{color:var(--text3)}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px 20px;font-family:var(--font);font-size:.92rem;font-weight:600;cursor:pointer;transition:all .2s;width:100%;margin-top:4px}
.btn-primary:hover{background:#5a52d5}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.auth-error{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);border-radius:var(--radius-sm);padding:10px 14px;font-size:.82rem;color:var(--danger);margin-bottom:14px;display:none}
.auth-success{background:rgba(0,212,170,.12);border:1px solid rgba(0,212,170,.3);border-radius:var(--radius-sm);padding:10px 14px;font-size:.82rem;color:var(--success);margin-bottom:14px;display:none}
.auth-divider{text-align:center;margin:20px 0;color:var(--text3);font-size:.78rem;position:relative}
.auth-divider::before,.auth-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
.auth-divider::before{left:0}.auth-divider::after{right:0}
.auth-link{text-align:center;font-size:.82rem;color:var(--text3);margin-top:20px}
.auth-link a{color:var(--accent);text-decoration:none;font-weight:600}
.auth-link a:hover{text-decoration:underline}
.input-wrap{position:relative}
.input-wrap input{padding-right:42px}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:.85rem;padding:4px}
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:#1f1f1f;border:1px solid #e0e0e0;
  border-radius:var(--radius-sm);padding:11px 20px;
  font-family:var(--font);font-size:.9rem;font-weight:600;
  cursor:pointer;transition:all .2s;margin-bottom:4px;
}
.btn-google:hover{background:#f5f5f5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:#fff;animation:bounce .8s infinite}
.loading-dots span:nth-child(2){animation-delay:.15s}
.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(0.6)}40%{transform:scale(1)}}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <img src="logo-icon.png" alt="Z" style="width:52px;height:52px;object-fit:contain;margin-bottom:12px">
    <div class="auth-logo-text" style="background:linear-gradient(90deg,#00cfff,#6c63ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800">Zyvora</div>
    <div class="auth-logo-sub">AI Appointment Manager</div>
  </div>

  <div class="auth-card">
    <div class="auth-title">Welcome back 👋</div>
    <div class="auth-sub">Sign in to your account to continue</div>

    <div class="auth-error" id="errorMsg"></div>
    <div class="auth-success" id="successMsg"></div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username" autofocus>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
        <button class="toggle-pw" onclick="togglePw('password',this)" tabindex="-1">👁</button>
      </div>
    </div>

    <button class="btn-primary" id="loginBtn" onclick="doLogin()">Sign In</button>

    <div class="auth-divider">or</div>

    <button class="btn-google" id="googleBtn" onclick="doGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="auth-link">
      Don't have an account? <a href="register.html">Create one free</a>
    </div>
  </div>
</div>

<script type="module">
import { loginUser, signInWithGoogle } from "./auth.js";

if (localStorage.getItem("loggedInUser")) {
  window.location.href = "app.html";
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg; el.style.display = "block";
  document.getElementById("successMsg").style.display = "none";
}

window.doLogin = async function() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  if (!username || !password) { showError("Please enter your username and password."); return; }
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';
  try {
    await loginUser(username, password);
  } catch(e) {
    showError(e.message);
    btn.disabled = false; btn.textContent = "Sign In";
  }
};

window.doGoogle = async function() {
  const btn = document.getElementById("googleBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';
  try {
    await signInWithGoogle();
  } catch(e) {
    showError("Google sign-in failed: " + e.message);
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google`;
  }
};

window.togglePw = function(inputId, btn) {
  const input = document.getElementById(inputId);
  input.type = input.type === "password" ? "text" : "password";
  btn.textContent = input.type === "password" ? "👁" : "🙈";
};
</script>
</body>
</html>
