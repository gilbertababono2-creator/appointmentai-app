<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Zyvora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0e14;--surface:#13151f;--surface2:#1a1d2b;--border:#2a2d40;
  --accent:#6c63ff;--accent2:#00d4aa;--text:#e8eaf6;--text2:#9ca0b8;--text3:#5c6082;
  --danger:#ff6b6b;--success:#00d4aa;--warning:#ffb347;
  --radius:14px;--radius-sm:8px;--font:'Sora',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-wrap{width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo-icon{width:52px;height:52px;background:var(--accent);border-radius:14px;display:inline-grid;place-items:center;font-size:1.5rem;margin-bottom:12px;box-shadow:0 8px 24px rgba(108,99,255,.4)}
.auth-logo-text{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.auth-logo-sub{font-size:.82rem;color:var(--text3);margin-top:4px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.auth-title{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.auth-sub{font-size:.82rem;color:var(--text3);margin-bottom:24px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-group label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.form-group input,.form-group select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;transition:border-color .2s;width:100%}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.form-group input::placeholder{color:var(--text3)}
.form-group select option{background:var(--surface2)}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px 20px;font-family:var(--font);font-size:.92rem;font-weight:600;cursor:pointer;transition:all .2s;width:100%;margin-top:4px}
.btn-primary:hover{background:#5a52d5}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.auth-error{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);border-radius:var(--radius-sm);padding:10px 14px;font-size:.82rem;color:var(--danger);margin-bottom:14px;display:none}
.auth-success{background:rgba(0,212,170,.12);border:1px solid rgba(0,212,170,.3);border-radius:var(--radius-sm);padding:10px 14px;font-size:.82rem;color:var(--success);margin-bottom:14px;display:none}
.pw-strength{height:4px;border-radius:10px;margin-top:5px;background:var(--border);overflow:hidden}
.pw-strength-fill{height:100%;border-radius:10px;transition:width .3s,background .3s;width:0%}
.pw-hint{font-size:.68rem;color:var(--text3);margin-top:3px}
.auth-divider{text-align:center;margin:18px 0;color:var(--text3);font-size:.78rem;position:relative}
.auth-divider::before,.auth-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
.auth-divider::before{left:0}.auth-divider::after{right:0}
.auth-link{text-align:center;font-size:.82rem;color:var(--text3);margin-top:18px}
.auth-link a{color:var(--accent);text-decoration:none;font-weight:600}
.input-wrap{position:relative}
.input-wrap input{padding-right:42px}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:.85rem;padding:4px}
.free-badge{background:rgba(0,212,170,.12);border:1px solid rgba(0,212,170,.25);border-radius:var(--radius-sm);padding:10px 14px;font-size:.8rem;color:var(--success);margin-bottom:16px;text-align:center}
.loading-dots{display:inline-flex;gap:4px}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:#fff;animation:bounce .8s infinite}
.loading-dots span:nth-child(2){animation-delay:.15s}
.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(0.6)}40%{transform:scale(1)}}
@media(max-width:400px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <img src="logo-icon.png" alt="Z" style="width:52px;height:52px;object-fit:contain;margin-bottom:12px">
    <div class="auth-logo-text" style="background:linear-gradient(90deg,#00cfff,#6c63ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800">Zyvora</div>
    <div class="auth-logo-sub">AI Appointment Manager</div>
  </div>

  <div class="auth-card">
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Start managing appointments smarter with AI</div>

    <div class="free-badge">🆓 Free plan — 10 appointments/month, no card needed</div>

    <div class="auth-error" id="errorMsg"></div>
    <div class="auth-success" id="successMsg"></div>

    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="Kofi" autocomplete="given-name">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="Mensah" autocomplete="family-name">
      </div>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="e.g. kofi_mensah" autocomplete="username"
        oninput="checkUsername()">
      <div class="pw-hint" id="usernameHint">3+ characters, letters and numbers only</div>
    </div>

    <div class="form-group">
      <label>Email (optional)</label>
      <input type="email" id="email" placeholder="kofi@example.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label>Business Type</label>
      <select id="businessType">
        <option value="">Select your business…</option>
        <option value="salon">💇 Salon / Barbershop</option>
        <option value="clinic">🏥 Clinic / Healthcare</option>
        <option value="spa">💆 Spa / Wellness</option>
        <option value="gym">💪 Gym / Fitness</option>
        <option value="consultant">💼 Consultant</option>
        <option value="beauty">💅 Beauty / Nail Care</option>
        <option value="tailor">🧵 Tailor / Fashion</option>
        <option value="other">📋 Other Service</option>
      </select>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Min. 6 characters"
          autocomplete="new-password" oninput="checkPwStrength()">
        <button class="toggle-pw" onclick="togglePw('password',this)" tabindex="-1">👁</button>
      </div>
      <div class="pw-strength"><div class="pw-strength-fill" id="pwFill"></div></div>
      <div class="pw-hint" id="pwHint">Enter a password</div>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="confirmPassword" placeholder="Repeat your password"
          autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()">
        <button class="toggle-pw" onclick="togglePw('confirmPassword',this)" tabindex="-1">👁</button>
      </div>
    </div>

    <button class="btn-primary" id="registerBtn" onclick="doRegister()">Create Account</button>

    <div class="auth-divider">or</div>

    <div class="auth-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Redirect if already logged in
if (localStorage.getItem("loggedInUser")) {
  window.location.href = "app.html";
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = "⚠️ " + msg;
  el.style.display = "block";
  document.getElementById("successMsg").style.display = "none";
}

function showSuccess(msg) {
  const el = document.getElementById("successMsg");
  el.textContent = "✅ " + msg;
  el.style.display = "block";
  document.getElementById("errorMsg").style.display = "none";
}

function setLoading(loading) {
  const btn = document.getElementById("registerBtn");
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<span class="loading-dots"><span></span><span></span><span></span></span>'
    : "Create Account";
}

window.checkPwStrength = function() {
  const pw = document.getElementById("password").value;
  const fill = document.getElementById("pwFill");
  const hint = document.getElementById("pwHint");
  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 10) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const colors = ["#ff6b6b","#ff6b6b","#ffb347","#6c63ff","#00d4aa"];
  const labels = ["Too short","Weak","Fair","Good","Strong"];
  fill.style.width = (score * 20) + "%";
  fill.style.background = colors[Math.max(0,score-1)];
  hint.textContent = pw.length === 0 ? "Enter a password" : labels[Math.max(0,score-1)];
};

window.checkUsername = function() {
  const val = document.getElementById("username").value;
  const hint = document.getElementById("usernameHint");
  if (!val) { hint.textContent = "3+ characters, letters and numbers only"; hint.style.color = "var(--text3)"; return; }
  if (val.length < 3) { hint.textContent = "Too short"; hint.style.color = "var(--danger)"; return; }
  if (!/^[a-zA-Z0-9_]+$/.test(val)) { hint.textContent = "Letters, numbers and underscores only"; hint.style.color = "var(--danger)"; return; }
  hint.textContent = "✓ Looks good"; hint.style.color = "var(--success)";
};

window.togglePw = function(inputId, btn) {
  const input = document.getElementById(inputId);
  input.type = input.type === "password" ? "text" : "password";
  btn.textContent = input.type === "password" ? "👁" : "🙈";
};

window.doRegister = async function() {
  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const username = document.getElementById("username").value.trim().toLowerCase();
  const email = document.getElementById("email").value.trim();
  const businessType = document.getElementById("businessType").value;
  const password = document.getElementById("password").value;
  const confirmPw = document.getElementById("confirmPassword").value;

  // Validation
  if (!firstName || !lastName) { showError("Please enter your first and last name."); return; }
  if (!username || username.length < 3) { showError("Username must be at least 3 characters."); return; }
  if (!/^[a-zA-Z0-9_]+$/.test(username)) { showError("Username can only contain letters, numbers and underscores."); return; }
  if (password.length < 6) { showError("Password must be at least 6 characters."); return; }
  if (password !== confirmPw) { showError("Passwords do not match."); return; }

  setLoading(true);

  try {
    // Check if username already taken
    const existing = await getDocs(query(
      collection(db, "users"),
      where("username", "==", username)
    ));

    if (!existing.empty) {
      showError("Username already taken. Please choose another.");
      setLoading(false);
      return;
    }

    // Create user
    await addDoc(collection(db, "users"), {
      username,
      password,
      firstName,
      lastName,
      email: email || "",
      businessType: businessType || "other",
      plan: "free",
      createdAt: serverTimestamp()
    });

    // Save email for Paystack
    if (email) localStorage.setItem("userEmail", email);

    showSuccess("Account created! Signing you in…");

    // Auto-login
    localStorage.setItem("loggedInUser", username);
    setTimeout(() => { window.location.href = "app.html"; }, 1200);

  } catch(e) {
    console.error("Register error:", e);
    showError("Registration failed: " + e.message);
    setLoading(false);
  }
};
</script>
</body>
</html>
