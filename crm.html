<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — Zyvora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
.crm-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.crm-search{flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 14px;color:var(--text);font-family:var(--font);font-size:.85rem;outline:none}
.crm-search:focus{border-color:var(--accent)}
.crm-filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-family:var(--font);font-size:.78rem;font-weight:600;padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s}
.crm-filter-btn.active,.crm-filter-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.crm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.crm-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;cursor:pointer;transition:all .2s;position:relative}
.crm-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.crm-card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.crm-avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-glow);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:1rem;flex-shrink:0;border:2px solid rgba(108,99,255,.3)}
.crm-avatar.vip{background:rgba(255,179,71,.15);color:var(--warning);border-color:rgba(255,179,71,.4)}
.crm-name{font-size:.9rem;font-weight:700;color:var(--text)}
.crm-phone{font-size:.75rem;color:var(--text3);margin-top:1px}
.vip-badge{position:absolute;top:10px;right:10px;font-size:.65rem;font-weight:700;background:rgba(255,179,71,.15);color:var(--warning);padding:2px 8px;border-radius:20px;border:1px solid rgba(255,179,71,.3)}
.crm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.crm-stat{text-align:center;background:var(--surface);border-radius:6px;padding:6px 4px}
.crm-stat strong{display:block;font-size:.85rem;font-weight:700;color:var(--text);font-family:var(--mono)}
.crm-stat span{font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.03em}
.crm-tags{display:flex;gap:4px;flex-wrap:wrap}
.loyalty-wrap{margin-top:8px}
.loyalty-label{font-size:.68rem;color:var(--text3);display:flex;justify-content:space-between;margin-bottom:3px}
.loyalty-bar{height:4px;background:var(--surface3);border-radius:10px;overflow:hidden}
.loyalty-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-header h3{font-size:1rem;font-weight:700}
.modal-header button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.2rem;line-height:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-section-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px}
.history-item{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;font-size:.8rem;display:flex;align-items:center;gap:10px}
.history-item .tag{flex-shrink:0}
.notes-box{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-family:var(--font);font-size:.85rem;resize:vertical;min-height:80px;outline:none}
.notes-box:focus{border-color:var(--accent)}
.ai-reco-box{background:var(--surface2);border:1px solid rgba(108,99,255,.3);border-radius:var(--radius-sm);padding:14px;font-size:.82rem;color:var(--text2);line-height:1.6;white-space:pre-wrap}
.empty-crm{display:flex;flex-direction:column;align-items:center;padding:60px 20px;color:var(--text3);gap:12px;text-align:center}
.empty-crm .empty-icon{font-size:2.5rem}
@media(max-width:600px){.crm-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-wrapper">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="logo-icon.png" alt="Zyvora" style="width:32px;height:32px;object-fit:contain;border-radius:6px"><span class="logo-text" style="background:linear-gradient(90deg,#00cfff,#6c63ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800">Zyvora</span>
    </div>
    <nav class="sidebar-nav">
      <a href="app.html" class="nav-item"><span class="nav-icon">📅</span> Appointments</a>
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="calendar.html" class="nav-item"><span class="nav-icon">🗓</span> Calendar</a>
      <a href="crm.html" class="nav-item active"><span class="nav-icon">👥</span> Customers</a>
      <a href="comms.html" class="nav-item"><span class="nav-icon">📲</span> Comms</a>
      <a href="ai-chat.html" class="nav-item"><span class="nav-icon">🤖</span> AI Assistant</a>
      <a href="pricing.html" class="nav-item"><span class="nav-icon">⚡</span> Upgrade</a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-info">
        <span id="welcomeUser">Loading…</span>
        <span class="plan-badge" id="planBadge">Free</span>
      </div>
      <button id="logoutBtn" class="logout-btn">↗</button>
    </div>
  </aside>

  <header class="mobile-header">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <span class="logo-text">Customers</span>
  </header>

  <main class="main-content">

    <section class="section-card">
      <div class="section-header">
        <h2>👥 Customer CRM</h2>
        <span id="customerCount" style="font-size:.78rem;color:var(--text3)">0 customers</span>
      </div>

      <div class="crm-toolbar">
        <input class="crm-search" id="crmSearch" placeholder="🔍 Search by name or phone…" oninput="filterCustomers()">
        <button class="crm-filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
        <button class="crm-filter-btn" data-filter="vip" onclick="setFilter('vip',this)">⭐ VIP</button>
        <button class="crm-filter-btn" data-filter="risk" onclick="setFilter('risk',this)">⚠ At Risk</button>
        <button class="crm-filter-btn" data-filter="new" onclick="setFilter('new',this)">🆕 New</button>
      </div>

      <div id="crmGrid" class="crm-grid">
        <div class="empty-crm">
          <span class="empty-icon">👥</span>
          <p>Loading customers…</p>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- Customer detail modal -->
<div class="modal-overlay" id="crmModal" style="display:none" onclick="if(event.target===this)closeCRM()">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalName">Customer</h3>
      <button onclick="closeCRM()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, query, where, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getUserPlan } from "./plans.js";
import { callAI, esc } from "./ai-utils.js";
const currentUser = localStorage.getItem("loggedInUser");
if (!currentUser) { window.location.href = "login.html"; }

document.getElementById("welcomeUser").textContent = currentUser;
document.getElementById("userAvatar").textContent = (currentUser||"?")[0].toUpperCase();
getUserPlan(currentUser).then(p=>{
  const plan=p?.plan||"free";
  const b=document.getElementById("planBadge");
  b.textContent=plan[0].toUpperCase()+plan.slice(1);
  b.className="plan-badge "+plan;
}).catch(()=>{});
document.getElementById("logoutBtn")?.addEventListener("click",()=>{
  localStorage.removeItem("loggedInUser"); window.location.href="login.html";
});
document.getElementById("menuToggle")?.addEventListener("click",()=>{
  document.getElementById("sidebar").classList.toggle("open");
});

let allAppts = [];
let customers = {};
let currentFilter = "all";

// Load appointments
const q = query(collection(db,"appointments"), where("uid","==",currentUser));
onSnapshot(q, snap => {
  allAppts = snap.docs.map(d=>({id:d.id,...d.data()}));
  buildCustomers();
  renderGrid();
}, err => console.error(err));

function buildCustomers() {
  customers = {};
  allAppts.forEach(a => {
    const key = a.phone || a.clientName;
    if (!key) return;
    if (!customers[key]) {
      customers[key] = {
        name: a.clientName,
        phone: a.phone || "",
        appointments: [],
        services: new Set(),
        firstSeen: a.date,
        lastSeen: a.date,
        notes: ""
      };
    }
    customers[key].appointments.push(a);
    if (a.service) customers[key].services.add(a.service);
    if (a.date < customers[key].firstSeen) customers[key].firstSeen = a.date;
    if (a.date > customers[key].lastSeen) customers[key].lastSeen = a.date;
  });

  // Calculate derived fields
  Object.values(customers).forEach(c => {
    c.total = c.appointments.length;
    c.completed = c.appointments.filter(a=>a.status==="completed").length;
    c.cancelled = c.appointments.filter(a=>a.status==="cancelled").length;
    c.atRisk = c.appointments.some(a=>a.noShowRisk==="high"&&a.status==="pending");
    c.isVIP = c.total >= 5 || c.completed >= 3;
    c.isNew = c.total === 1;
    // Loyalty points: 10 per completed, -5 per cancelled
    c.loyaltyPoints = Math.max(0, c.completed * 10 - c.cancelled * 5);
    c.loyaltyLevel = c.loyaltyPoints >= 50 ? "Gold" : c.loyaltyPoints >= 20 ? "Silver" : "Bronze";
    // Days since last visit
    const last = new Date(c.lastSeen);
    const diff = Math.floor((new Date()-last)/(1000*60*60*24));
    c.daysSinceVisit = diff;
  });
}

window.filterCustomers = filterCustomers;
window.setFilter = setFilter;

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll(".crm-filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderGrid();
}

function filterCustomers() {
  renderGrid();
}

function renderGrid() {
  const search = document.getElementById("crmSearch")?.value?.toLowerCase() || "";
  let list = Object.values(customers);

  if (search) list = list.filter(c =>
    c.name.toLowerCase().includes(search) || c.phone.includes(search)
  );
  if (currentFilter === "vip") list = list.filter(c=>c.isVIP);
  if (currentFilter === "risk") list = list.filter(c=>c.atRisk);
  if (currentFilter === "new") list = list.filter(c=>c.isNew);

  list.sort((a,b) => b.total - a.total);

  document.getElementById("customerCount").textContent = list.length+" customers";
  const grid = document.getElementById("crmGrid");

  if (!list.length) {
    grid.innerHTML = `<div class="empty-crm"><span class="empty-icon">👥</span><p>No customers found.</p></div>`;
    return;
  }

  grid.innerHTML = list.map(c => {
    const initials = c.name.split(" ").map(n=>n[0]).join("").toUpperCase().slice(0,2);
    const loyalty_pct = Math.min((c.loyaltyPoints/50)*100,100);
    const key = c.phone || c.name;
    return `<div class="crm-card" onclick="openCRM('${esc(key)}')">
      ${c.isVIP ? '<div class="vip-badge">⭐ VIP</div>' : ''}
      <div class="crm-card-top">
        <div class="crm-avatar ${c.isVIP?'vip':''}">${initials}</div>
        <div>
          <div class="crm-name">${esc(c.name)}</div>
          <div class="crm-phone">${c.phone||'No phone'}</div>
        </div>
      </div>
      <div class="crm-stats">
        <div class="crm-stat"><strong>${c.total}</strong><span>Visits</span></div>
        <div class="crm-stat"><strong>${c.completed}</strong><span>Done</span></div>
        <div class="crm-stat"><strong>${c.loyaltyPoints}</strong><span>Points</span></div>
      </div>
      <div class="crm-tags">
        ${c.isVIP?'<span class="tag" style="background:rgba(255,179,71,.15);color:var(--warning)">⭐ VIP</span>':''}
        ${c.atRisk?'<span class="tag tag-risk">⚠ Risk</span>':''}
        ${c.isNew?'<span class="tag tag-service">🆕 New</span>':''}
        ${c.daysSinceVisit>30?'<span class="tag" style="background:rgba(255,107,107,.1);color:var(--danger)">Inactive</span>':''}
        <span class="tag tag-service">${c.loyaltyLevel}</span>
      </div>
      <div class="loyalty-wrap">
        <div class="loyalty-label"><span>Loyalty</span><span>${c.loyaltyPoints} pts</span></div>
        <div class="loyalty-bar"><div class="loyalty-fill" style="width:${loyalty_pct}%"></div></div>
      </div>
    </div>`;
  }).join("");
}

window.openCRM = async function(key) {
  const c = customers[key];
  if (!c) return;
  document.getElementById("modalName").textContent = c.name;
  document.getElementById("crmModal").style.display = "flex";

  // Load saved notes from Firestore
  let savedNotes = "";
  try {
    const snap = await getDoc(doc(db, "customer_notes", currentUser+"_"+key));
    if (snap.exists()) savedNotes = snap.data().notes || "";
  } catch(e) {}

  const history = c.appointments
    .sort((a,b)=>b.date?.localeCompare(a.date))
    .map(a=>`<div class="history-item">
      <span class="tag tag-${a.status||'pending'}">${a.status||'pending'}</span>
      <div>
        <strong>${a.service||'Appointment'}</strong> · ${a.date} ${a.time}
        ${a.notes?`<div style="color:var(--text3);font-size:.72rem;margin-top:2px">💬 ${esc(a.notes)}</div>`:''}
      </div>
    </div>`).join("");

  const services = [...c.services].join(", ") || "—";
  const ltv = c.completed * 50; // rough GHS estimate

  document.getElementById("modalBody").innerHTML = `
    <div>
      <div class="modal-section-title">Profile</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.82rem;color:var(--text2)">
        <div>📞 ${c.phone||'No phone'}</div>
        <div>📅 ${c.total} visits</div>
        <div>⭐ ${c.loyaltyPoints} loyalty pts</div>
        <div>🏷 ${c.loyaltyLevel}</div>
        <div>🔖 Services: ${services}</div>
        <div>💰 Est. LTV: ₵${ltv}</div>
        <div>🗓 First: ${c.firstSeen}</div>
        <div>🗓 Last: ${c.lastSeen}</div>
      </div>
    </div>
    <div>
      <div class="modal-section-title">Appointment History (${c.total})</div>
      <div style="display:flex;flex-direction:column;gap:6px">${history||'No appointments'}</div>
    </div>
    <div>
      <div class="modal-section-title">Notes</div>
      <textarea class="notes-box" id="customerNotes" placeholder="Add notes about this customer…">${savedNotes}</textarea>
      <button class="btn-primary" style="margin-top:8px;width:auto;padding:8px 18px" onclick="saveNotes('${esc(key)}')">Save Notes</button>
    </div>
    <div>
      <div class="modal-section-title">🤖 AI Retention Recommendation</div>
      <div class="ai-reco-box" id="aiReco">Click "Get AI Tips" below to get personalised retention advice for this customer.</div>
      <button class="ai-suggest-btn" style="margin-top:8px" onclick="getAITips('${esc(key)}')">🤖 Get AI Tips</button>
    </div>
  `;
};

window.saveNotes = async function(key) {
  const notes = document.getElementById("customerNotes")?.value || "";
  try {
    await setDoc(doc(db,"customer_notes",currentUser+"_"+key), { notes, updatedAt: new Date().toISOString() });
    alert("✅ Notes saved!");
  } catch(e) { alert("Error saving: "+e.message); }
};

window.getAITips = async function(key) {
  const c = customers[key];
  const el = document.getElementById("aiReco");
  if (!navigator.onLine) { el.textContent = "📵 No internet connection."; return; }
  el.textContent = "🤖 Generating personalised tips…";
  try {
    el.textContent = await callAI([
      {role:"system",content:"You are a customer retention specialist for a Ghanaian service business. Give warm, practical, specific advice."},
      {role:"user",content:`Customer: ${c.name}, ${c.total} visits, ${c.completed} completed, last visit ${c.daysSinceVisit} days ago, services: ${[...c.services].join(",")||"general"}, loyalty: ${c.loyaltyPoints} points. Give 3 specific tips to retain and re-engage this customer.`}
    ], 400,
    () => { el.textContent = "⏳ Waking up AI…"; });
  } catch(e) { el.textContent = "❌ " + e.message; }
};

window.closeCRM = function() {
  document.getElementById("crmModal").style.display = "none";
};
</script>
</body>
</html>
