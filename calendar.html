<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Zyvora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;font-size:.95rem;display:grid;place-items:center;transition:all .2s}
.cal-nav-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.cal-title{font-size:1rem;font-weight:700;color:var(--text);min-width:180px;text-align:center}
.cal-view-tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:8px}
.cal-view-btn{background:none;border:none;color:var(--text3);font-family:var(--font);font-size:.75rem;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .2s}
.cal-view-btn.active{background:var(--accent);color:#fff}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--text3)}
.legend-dot{width:10px;height:10px;border-radius:50%}
/* Month view */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.month-day-header{font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--text3);text-align:center;padding:8px 0;background:var(--surface2);border-radius:4px}
.month-cell{min-height:80px;background:var(--surface2);border-radius:4px;padding:4px;border:1px solid transparent;transition:border-color .2s;cursor:pointer;overflow:hidden}
.month-cell:hover{border-color:var(--accent)}
.month-cell.other-month{opacity:.3}
.month-cell.today{border-color:var(--accent);background:rgba(108,99,255,.08)}
.month-cell.selected{border-color:var(--accent2);background:rgba(0,212,170,.08)}
.month-day-num{font-size:.72rem;font-weight:700;color:var(--text3);margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.month-cell.today .month-day-num{color:var(--accent)}
.cal-event-pill{font-size:.62rem;padding:2px 5px;border-radius:3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;cursor:pointer}
.cal-event-pill.pending{background:rgba(255,179,71,.8)}
.cal-event-pill.confirmed{background:rgba(108,99,255,.85)}
.cal-event-pill.completed{background:rgba(0,212,170,.7)}
.cal-event-pill.cancelled{background:rgba(255,107,107,.5)}
.cal-event-pill.risk{border-left:3px solid #ff6b6b}
.more-pill{font-size:.6rem;color:var(--accent);cursor:pointer;padding:1px 4px}
/* Week view */
.week-container{overflow-x:auto}
.week-grid{display:grid;grid-template-columns:48px repeat(7,1fr);min-width:500px}
.week-header-spacer{background:var(--surface2);border-radius:4px 0 0 0}
.week-col-header{background:var(--surface2);text-align:center;padding:8px 4px;font-size:.72rem;font-weight:700;color:var(--text2);border-left:1px solid var(--border)}
.week-col-header.today{color:var(--accent);background:rgba(108,99,255,.08)}
.week-col-header .day-num{font-size:1.1rem;font-family:var(--mono);display:block}
.week-time-col{font-size:.62rem;color:var(--text3);text-align:right;padding-right:6px;height:50px;display:flex;align-items:flex-start;padding-top:3px;border-top:1px solid var(--border)}
.week-slot{height:50px;border-top:1px solid var(--border);border-left:1px solid var(--border);position:relative;cursor:pointer;transition:background .15s}
.week-slot:hover{background:rgba(108,99,255,.06)}
.week-event{position:absolute;left:2px;right:2px;top:2px;border-radius:4px;padding:2px 5px;font-size:.65rem;color:#fff;overflow:hidden;cursor:pointer;line-height:1.3;z-index:2}
.week-event.pending{background:rgba(255,179,71,.9)}
.week-event.confirmed{background:var(--accent)}
.week-event.completed{background:var(--success)}
.week-event.cancelled{background:var(--danger);opacity:.6}
/* Day view */
.day-timeline{display:flex;flex-direction:column;gap:2px}
.day-hour-row{display:grid;grid-template-columns:48px 1fr;gap:0}
.day-hour-label{font-size:.68rem;color:var(--text3);text-align:right;padding-right:8px;padding-top:4px;height:52px;display:flex;align-items:flex-start;justify-content:flex-end}
.day-hour-slot{height:52px;border-top:1px solid var(--border);position:relative;cursor:pointer;transition:background .15s}
.day-hour-slot:hover{background:rgba(108,99,255,.05)}
.day-event{position:absolute;left:4px;right:4px;top:2px;border-radius:6px;padding:4px 8px;font-size:.75rem;color:#fff;overflow:hidden;cursor:pointer;line-height:1.4;z-index:2;border-left:3px solid rgba(255,255,255,.4)}
.day-event.pending{background:rgba(255,179,71,.9)}
.day-event.confirmed{background:var(--accent)}
.day-event.completed{background:var(--success)}
.day-event.cancelled{background:var(--danger);opacity:.7}
/* Appt detail panel */
.appt-detail-panel{position:fixed;right:0;top:0;bottom:0;width:300px;background:var(--surface);border-left:1px solid var(--border);z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;box-shadow:-4px 0 20px rgba(0,0,0,.3)}
.appt-detail-panel.open{transform:translateX(0)}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border)}
.panel-header h3{font-size:.95rem;font-weight:700}
.panel-header button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.1rem}
.panel-body{padding:16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.panel-field{font-size:.82rem;display:flex;flex-direction:column;gap:3px}
.panel-field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);font-weight:700}
.panel-field span{color:var(--text)}
.panel-actions{padding:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
@media(max-width:720px){
  .appt-detail-panel{width:100%;bottom:0;top:auto;height:60vh;transform:translateY(100%);border-left:none;border-top:1px solid var(--border)}
  .appt-detail-panel.open{transform:translateY(0)}
}
</style>
</head>
<body>
<div class="app-wrapper">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⚡</span><span class="logo-text">Zyvora</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item"><span class="nav-icon">📅</span> Appointments</a>
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="calendar.html" class="nav-item active"><span class="nav-icon">🗓</span> Calendar</a>
      <a href="crm.html" class="nav-item"><span class="nav-icon">👥</span> Customers</a>
      <a href="ai-chat.html" class="nav-item"><span class="nav-icon">🤖</span> AI Assistant</a>
      <a href="pricing.html" class="nav-item"><span class="nav-icon">⚡</span> Upgrade</a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-info">
        <span id="welcomeUser">Loading…</span>
        <span class="plan-badge" id="planBadge">Free</span>
      </div>
      <button id="logoutBtn" class="logout-btn">↗</button>
    </div>
  </aside>

  <header class="mobile-header">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <span class="logo-text">Calendar</span>
    <a href="index.html" class="mobile-upgrade">+</a>
  </header>

  <main class="main-content" style="padding-right:0">

    <section class="section-card" style="margin-right:24px">

      <!-- Toolbar -->
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="prevBtn">‹</button>
          <div class="cal-title" id="calTitle">June 2026</div>
          <button class="cal-nav-btn" id="nextBtn">›</button>
          <button class="cal-nav-btn" id="todayBtn" title="Today" style="font-size:.7rem;width:auto;padding:0 10px;font-family:var(--font);font-weight:700">Today</button>
        </div>
        <div class="cal-view-tabs">
          <button class="cal-view-btn active" data-view="month">Month</button>
          <button class="cal-view-btn" data-view="week">Week</button>
          <button class="cal-view-btn" data-view="day">Day</button>
        </div>
      </div>

      <!-- Legend -->
      <div class="cal-legend">
        <div class="legend-item"><div class="legend-dot" style="background:rgba(255,179,71,.9)"></div>Pending</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Confirmed</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div>Completed</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>Cancelled</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--danger);border:2px solid #fff"></div>At Risk</div>
      </div>

      <!-- Calendar output -->
      <div id="calOutput"></div>

    </section>

  </main>
</div>

<!-- Appointment detail panel -->
<div class="appt-detail-panel" id="detailPanel">
  <div class="panel-header">
    <h3>Appointment</h3>
    <button onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-actions" id="panelActions"></div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getUserPlan } from "./plans.js";
import { callAI, getLocalToday, esc } from "./ai-utils.js";

const currentUser = localStorage.getItem("loggedInUser");
if (!currentUser) { window.location.href = "login.html"; }
document.getElementById("welcomeUser").textContent = currentUser;
document.getElementById("userAvatar").textContent = (currentUser||"?")[0].toUpperCase();
getUserPlan(currentUser).then(p=>{
  const plan=p?.plan||"free";
  const b=document.getElementById("planBadge");
  b.textContent=plan[0].toUpperCase()+plan.slice(1);
  b.className="plan-badge "+plan;
}).catch(()=>{});
document.getElementById("logoutBtn")?.addEventListener("click",()=>{
  localStorage.removeItem("loggedInUser"); window.location.href="login.html";
});
document.getElementById("menuToggle")?.addEventListener("click",()=>{
  document.getElementById("sidebar").classList.toggle("open");
});

let allAppts = [];
let currentView = "month";
let currentDate = new Date();
const todayStr = getLocalToday();
const HOURS = Array.from({length:13},(_,i)=>i+7); // 7am-7pm

// Load
const q = query(collection(db,"appointments"), where("uid","==",currentUser));
onSnapshot(q, snap=>{
  allAppts = snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
}, err=>console.error(err));

// Nav
document.getElementById("prevBtn").addEventListener("click",()=>{ navigate(-1); });
document.getElementById("nextBtn").addEventListener("click",()=>{ navigate(1); });
document.getElementById("todayBtn").addEventListener("click",()=>{ currentDate=new Date(); render(); });

document.querySelectorAll(".cal-view-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".cal-view-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    render();
  });
});

function navigate(dir) {
  if (currentView==="month") currentDate.setMonth(currentDate.getMonth()+dir);
  else if (currentView==="week") currentDate.setDate(currentDate.getDate()+(dir*7));
  else currentDate.setDate(currentDate.getDate()+dir);
  render();
}

function render() {
  updateTitle();
  if (currentView==="month") renderMonth();
  else if (currentView==="week") renderWeek();
  else renderDay();
}

function updateTitle() {
  const opts = {month:"long",year:"numeric"};
  if (currentView==="day") {
    document.getElementById("calTitle").textContent =
      currentDate.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  } else if (currentView==="week") {
    const start = getWeekStart(currentDate);
    const end = new Date(start); end.setDate(end.getDate()+6);
    document.getElementById("calTitle").textContent =
      start.toLocaleDateString("en",{month:"short",day:"numeric"})+" – "+
      end.toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"});
  } else {
    document.getElementById("calTitle").textContent =
      currentDate.toLocaleDateString("en",opts);
  }
}

// ── Month view ─────────────────────────────────────────────
function renderMonth() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const daysInPrev = new Date(year,month,0).getDate();

  let html = `<div class="month-grid">`;
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
    html += `<div class="month-day-header">${d}</div>`;
  });

  let dayCount = 1;
  let nextCount = 1;
  for (let row=0; row<6; row++) {
    for (let col=0; col<7; col++) {
      const cellIdx = row*7+col;
      let dayNum, dateStr, otherMonth=false;
      if (cellIdx < firstDay) {
        dayNum = daysInPrev - firstDay + cellIdx + 1;
        const d = new Date(year,month-1,dayNum);
        dateStr = getLocalDateStr(d);
        otherMonth = true;
      } else if (dayCount > daysInMonth) {
        dayNum = nextCount++;
        const d = new Date(year,month+1,dayNum);
        dateStr = getLocalDateStr(d);
        otherMonth = true;
      } else {
        dayNum = dayCount++;
        const d = new Date(year,month,dayNum);
        dateStr = getLocalDateStr(d);
      }

      const isToday = dateStr===todayStr;
      const dayAppts = allAppts.filter(a=>a.date===dateStr).sort((a,b)=>a.time?.localeCompare(b.time));
      const maxShow = 3;
      const shown = dayAppts.slice(0,maxShow);
      const more = dayAppts.length - maxShow;

      let events = shown.map(a=>`
        <div class="cal-event-pill ${a.status||'pending'} ${a.noShowRisk==='high'?'risk':''}"
          onclick="event.stopPropagation();showAppt('${a.id}')"
          title="${esc(a.clientName)} · ${a.time}">
          ${a.time?.slice(0,5)||''} ${esc(a.clientName?.split(" ")[0]||'')}
        </div>`).join("");
      if (more>0) events += `<div class="more-pill">+${more} more</div>`;

      html += `<div class="month-cell ${otherMonth?'other-month':''} ${isToday?'today':''}"
        onclick="goToDay('${dateStr}')">
        <div class="month-day-num">
          <span>${dayNum}</span>
          ${dayAppts.length>0?`<span style="font-size:.6rem;color:var(--text3)">${dayAppts.length}</span>`:''}
        </div>
        ${events}
      </div>`;
    }
    if (dayCount > daysInMonth && row >= 3) break;
  }
  html += `</div>`;
  document.getElementById("calOutput").innerHTML = html;
}

// ── Week view ──────────────────────────────────────────────
function renderWeek() {
  const start = getWeekStart(currentDate);
  const days = Array.from({length:7},(_,i)=>{
    const d = new Date(start); d.setDate(d.getDate()+i); return d;
  });

  let html = `<div class="week-container"><div class="week-grid">`;
  // Headers
  html += `<div class="week-header-spacer"></div>`;
  days.forEach(d=>{
    const ds = getLocalDateStr(d);
    const isToday = ds===todayStr;
    html += `<div class="week-col-header ${isToday?'today':''}">
      <span class="day-num">${d.getDate()}</span>
      ${d.toLocaleDateString("en",{weekday:"short"})}
    </div>`;
  });

  // Time slots
  HOURS.forEach(h=>{
    html += `<div class="week-time-col">${h}:00</div>`;
    days.forEach(d=>{
      const ds = getLocalDateStr(d);
      const slotAppts = allAppts.filter(a=>{
        if (a.date!==ds) return false;
        const ah = parseInt(a.time?.split(":")[0]||0);
        return ah===h;
      });
      let events = slotAppts.map(a=>`
        <div class="week-event ${a.status||'pending'}"
          onclick="showAppt('${a.id}')"
          title="${esc(a.clientName)}">
          ${a.time?.slice(0,5)||''} ${esc(a.clientName?.split(" ")[0]||'')}
        </div>`).join("");
      html += `<div class="week-slot">${events}</div>`;
    });
  });

  html += `</div></div>`;
  document.getElementById("calOutput").innerHTML = html;
}

// ── Day view ───────────────────────────────────────────────
function renderDay() {
  const ds = getLocalDateStr(currentDate);
  const dayAppts = allAppts.filter(a=>a.date===ds);

  let html = `<div class="day-timeline">`;
  HOURS.forEach(h=>{
    const slotAppts = dayAppts.filter(a=>{
      const ah = parseInt(a.time?.split(":")[0]||0);
      return ah===h;
    });
    let events = slotAppts.map(a=>`
      <div class="day-event ${a.status||'pending'}"
        onclick="showAppt('${a.id}')">
        <strong>${esc(a.clientName)}</strong> · ${a.service||'Appointment'}
        <div style="font-size:.68rem;opacity:.85">${a.time} · ${a.duration||60}min</div>
        ${a.noShowRisk==='high'?'<div style="font-size:.65rem">⚠ No-show risk</div>':''}
      </div>`).join("");

    html += `<div class="day-hour-row">
      <div class="day-hour-label">${h}:00</div>
      <div class="day-hour-slot">${events}</div>
    </div>`;
  });
  html += `</div>`;

  if (!dayAppts.length) {
    html += `<div style="text-align:center;padding:20px;color:var(--text3);font-size:.85rem">
      No appointments on this day. <a href="index.html" style="color:var(--accent)">Book one →</a>
    </div>`;
  }

  document.getElementById("calOutput").innerHTML = html;
}

// Navigate to day view
window.goToDay = function(dateStr) {
  currentDate = new Date(dateStr+"T12:00:00");
  currentView = "day";
  document.querySelectorAll(".cal-view-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.view==="day");
  });
  render();
};

// Show appointment detail panel
window.showAppt = function(id) {
  const a = allAppts.find(x=>x.id===id);
  if (!a) return;

  document.getElementById("panelBody").innerHTML = `
    <div class="panel-field"><label>Client</label><span>${esc(a.clientName)}</span></div>
    <div class="panel-field"><label>Phone</label><span>${a.phone||'—'}</span></div>
    <div class="panel-field"><label>Service</label><span>${a.service||'General'}</span></div>
    <div class="panel-field"><label>Date & Time</label><span>${a.date} at ${a.time}</span></div>
    <div class="panel-field"><label>Duration</label><span>${a.duration||60} minutes</span></div>
    <div class="panel-field"><label>Status</label>
      <span class="tag tag-${a.status||'pending'}">${a.status||'pending'}</span>
    </div>
    ${a.noShowRisk==='high'?'<div class="panel-field"><label>Risk</label><span class="tag tag-risk">⚠ High no-show risk</span></div>':''}
    ${a.notes?`<div class="panel-field"><label>Notes</label><span>${esc(a.notes)}</span></div>`:''}
  `;

  document.getElementById("panelActions").innerHTML = `
    ${a.status==='pending'?`<button class="btn-primary" onclick="updateStatus('${a.id}','confirmed');closePanel()">✓ Confirm</button>`:''}
    ${a.status==='confirmed'?`<button class="btn-primary" onclick="updateStatus('${a.id}','completed');closePanel()">✔ Mark Done</button>`:''}
    ${a.status!=='cancelled'&&a.status!=='completed'?`<button class="btn-ghost" onclick="updateStatus('${a.id}','cancelled');closePanel()">✕ Cancel</button>`:''}
    <button class="btn-ghost" onclick="generateReminder(${JSON.stringify(a).replace(/"/g,'&quot;')})">📱 AI Reminder</button>
  `;

  document.getElementById("detailPanel").classList.add("open");
};

window.closePanel = function() {
  document.getElementById("detailPanel").classList.remove("open");
};

window.updateStatus = async (id,status) => {
  try {
    await updateDoc(doc(db,"appointments",id),{status});
    render();
  } catch(e) { alert("Error: "+e.message); }
};

window.generateReminder = async function(appt) {
  if (!navigator.onLine) { alert("📵 No internet connection."); return; }
  try {
    const text = await callAI([
      {role:"system",content:"Write a short friendly WhatsApp reminder under 100 words. Warm Ghanaian tone."},
      {role:"user",content:`Appointment: ${appt.clientName}, ${appt.service||'appointment'}, ${appt.date} at ${appt.time}`}
    ], 200);
    await navigator.clipboard.writeText(text);
    alert("✅ Reminder copied!\n\n"+text);
  } catch(e) { alert("Could not generate reminder: "+e.message); }
};

function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate()-day);
  return d;
}

function getLocalDateStr(d) {
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
render();
</script>
</body>
</html>
